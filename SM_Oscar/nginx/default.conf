server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    # ---- NUEVO: reenviar esquema y host al backend ----
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Encabezados que indican al backend el esquema original
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
    }

    # ---- SERVIR ARCHIVOS VITE ----
    location /build/ {
        alias /var/www/public/build/;
        try_files $uri $uri/ =404;
        # MIME types (nginx ya los conoce, pero por claridad)
        default_type application/octet-stream;
    }

    # Opcional: forzar actualización de recursos inseguros
    # add_header Content-Security-Policy "upgrade-insecure-requests";
}
