<!-- Modal de Inscripción -->
<div class="modal-overlay" id="inscripcionModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
            <h2 id="modalTitle"><i class="fas fa-pen-alt"></i> Inscripción al Seminario</h2>
            <button class="modal-close" id="modalClose" aria-label="Cerrar"><i class="fas fa-times"></i></button>
        </div>
        <form id="formInscripcion" class="modal-form" novalidate>

            <!-- Nombre -->
            <div class="form-group">
                <label for="inputNombre">Nombre completo</label>
                <input type="text" id="inputNombre" placeholder="Tu nombre completo" required>
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label for="inputCorreo">Correo electrónico</label>
                <input type="email" id="inputCorreo" placeholder="tu@correo.com" required>
            </div>

            <!-- ── NUEVO: Tipo de usuario ── -->
            <div class="form-group">
                <label for="inputTipoUsuario">
                    Tipo de usuario
                    <span class="tipo-badge" id="tipoBadge"></span>
                </label>
                <select id="inputTipoUsuario" required>
                    <option value="">-- Selecciona tu tipo de usuario --</option>
                    <option value="interno">Interno (FES Acatlán)</option>
                    <option value="externo">Externo</option>
                </select>
            </div>

            <!-- ── NUEVO: Número de cuenta (solo interno) ── -->
            <div class="form-group" id="grupo-numero-cuenta">
                <label for="inputNumeroCuenta">
                    <i class="fas fa-id-card" style="color:#003B6F; margin-right:4px;"></i>
                    Número de cuenta
                </label>
                <input
                    type="text"
                    id="inputNumeroCuenta"
                    placeholder="Ej. 420012345"
                    maxlength="9"
                    pattern="[0-9]{8,9}"
                    inputmode="numeric"
                >
            </div>
            <!-- ── fin nuevos campos ── -->

            <!-- Seminario -->
            <div class="form-group">
                <label for="modalSeminario">Seminario</label>
                <select id="modalSeminario" required></select>
            </div>

            <!-- Motivo -->
            <div class="form-group">
                <label for="inputMotivo">Motivo de inscripción</label>
                <textarea id="inputMotivo" rows="4" placeholder="¿Por qué deseas inscribirte a este seminario?" required></textarea>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Enviar inscripción</button>
        </form>
    </div>
</div>

<!-- ── Lógica: selector tipo de usuario ── -->
<script>
    (function () {
        const selectTipo   = document.getElementById('inputTipoUsuario');
        const grupoCuenta  = document.getElementById('grupo-numero-cuenta');
        const inputCuenta  = document.getElementById('inputNumeroCuenta');
        const badge        = document.getElementById('tipoBadge');

        selectTipo.addEventListener('change', function () {
            const tipo = this.value;

            if (tipo === 'interno') {
                // Mostrar campo con animación
                grupoCuenta.classList.add('visible');
                inputCuenta.setAttribute('required', 'required');

                // Badge azul "FES Acatlán"
                badge.textContent = 'FES Acatlán';
                badge.className = 'tipo-badge interno';

            } else {
                // Ocultar campo y limpiar
                grupoCuenta.classList.remove('visible');
                inputCuenta.removeAttribute('required');
                inputCuenta.value = '';

                if (tipo === 'externo') {
                    // Badge dorado "Externo"
                    badge.textContent = 'Externo';
                    badge.className = 'tipo-badge externo';
                } else {
                    // Sin selección: quitar badge
                    badge.textContent = '';
                    badge.className = 'tipo-badge';
                }
            }
        });

        // Limpiar número de cuenta al cerrar/resetear el modal
        const btnCerrar = document.getElementById('modalClose');
        const formulario = document.getElementById('formInscripcion');

        function resetTipoUsuario() {
            selectTipo.value = '';
            grupoCuenta.classList.remove('visible');
            inputCuenta.removeAttribute('required');
            inputCuenta.value = '';
            badge.textContent = '';
            badge.className = 'tipo-badge';
        }

        if (btnCerrar)  btnCerrar.addEventListener('click', resetTipoUsuario);
        if (formulario) formulario.addEventListener('reset', resetTipoUsuario);
    })();
</script>
